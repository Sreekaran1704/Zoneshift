name: zoneshift
version: "1.0.0"
profile: zoneshift

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  policy_date: "2025-01-05"      # congestion pricing start
  # Non-CBD Manhattan zones within this distance (feet, NY State Plane) of a CBD zone are border zones.
  # Small tolerance absorbs slivers in the TLC shapefile; river gaps (Roosevelt Island) are much wider.
  border_tolerance_ft: 100

models:
  zoneshift:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  zoneshift:
    +schema: seeds

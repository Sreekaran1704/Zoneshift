version: 2

seeds:
  - name: us_federal_holidays
    description: >
      US federal holidays (observed dates) for 2024-2027, generated with the Python
      `holidays` package (holidays.US(observed=True)). Extend when the analysis window grows.
    config:
      column_types:
        holiday_date: date
        holiday_name: string
    columns:
      - name: holiday_date
        description: Observed holiday date.
        data_tests: [unique, not_null]
      - name: holiday_name
        description: Holiday name.

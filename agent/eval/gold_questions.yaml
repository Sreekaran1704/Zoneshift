# Gold questions for the text-to-SQL agent (execution accuracy).
# Each gold query was run against data/zoneshift.duckdb; run_eval.py compares the agent's result
# set with the gold result set (row order ignored unless `ordered: true`; floats compared with a
# small tolerance; column names ignored). Questions say exactly what to return.
# Set reviewed: true after the project owner has checked every question and gold query;
# run_eval.py refuses to score a draft.
reviewed: true  # approved by the project owner 2026-10-15

questions:
  # ---------------------------------------------------------------- easy
  - id: e01
    difficulty: easy
    question: How many taxi zones are inside the congestion pricing zone (CBD)?
    sql: select count(*) from marts.dim_zone where is_cbd

  - id: e02
    difficulty: easy
    question: How many border zones are there?
    sql: select count(*) from marts.dim_zone where is_border_zone

  - id: e03
    difficulty: easy
    question: List the names of the border zones in alphabetical order.
    ordered: true
    sql: select zone from marts.dim_zone where is_border_zone order by zone

  - id: e04
    difficulty: easy
    question: How many clean trips are there in total?
    sql: select count(*) from marts.fct_trips

  - id: e05
    difficulty: easy
    question: How many clean green taxi trips are there?
    sql: select count(*) from marts.fct_trips where service_type = 'green'

  - id: e06
    difficulty: easy
    question: What is the average metered fare across all clean trips?
    sql: select avg(fare_amount) from marts.fct_trips

  - id: e07
    difficulty: easy
    question: How many US federal holidays are there in 2025?
    sql: select count(*) from marts.dim_date where year = 2025 and is_holiday

  - id: e08
    difficulty: easy
    question: Which borough contains the zone named 'JFK Airport'?
    sql: select borough from marts.dim_zone where zone = 'JFK Airport'

  - id: e09
    difficulty: easy
    question: What is the longest trip distance in miles among clean trips?
    sql: select max(trip_distance_mi) from marts.fct_trips

  - id: e10
    difficulty: easy
    question: How many taxi zones are in Manhattan?
    sql: select count(*) from marts.dim_zone where borough = 'Manhattan'

  - id: e11
    difficulty: easy
    question: How many days in the date dimension are on or after the congestion pricing start date?
    sql: select count(*) from marts.dim_date where post_policy

  - id: e12
    difficulty: easy
    question: How many clean trips were paid by credit card?
    sql: select count(*) from marts.fct_trips where payment_type = 1

  - id: e13
    difficulty: easy
    question: What is the total CBD congestion fee charged on clean trips, in dollars?
    sql: select sum(cbd_congestion_fee) from marts.fct_trips

  - id: e14
    difficulty: easy
    question: What is the earliest pickup date among clean trips?
    sql: select min(pickup_date) from marts.fct_trips

  - id: e15
    difficulty: easy
    question: How many distinct pickup zones appear in the clean trips?
    sql: select count(distinct pu_location_id) from marts.fct_trips

  # ---------------------------------------------------------------- medium
  - id: m01
    difficulty: medium
    question: How many clean trips were picked up in CBD zones in 2024?
    sql: >
      select count(*) from marts.fct_trips
      where pickup_in_cbd and pickup_date between date '2024-01-01' and date '2024-12-31'

  - id: m02
    difficulty: medium
    question: How many clean trips were picked up in each calendar year? Return year and trip count.
    sql: select year(pickup_date) as year, count(*) as trips from marts.fct_trips group by 1

  - id: m03
    difficulty: medium
    question: What are the top 5 pickup zones by number of clean trips? Return zone name and trip count, highest first.
    ordered: true
    sql: >
      select z.zone, count(*) as trips
      from marts.fct_trips f join marts.dim_zone z on z.location_id = f.pu_location_id
      group by z.zone order by trips desc limit 5

  - id: m04
    difficulty: medium
    question: How many clean trips were picked up in each borough? Return borough and trip count.
    sql: >
      select z.borough, count(*) as trips
      from marts.fct_trips f join marts.dim_zone z on z.location_id = f.pu_location_id
      group by z.borough

  - id: m05
    difficulty: medium
    question: Which hour of the day (0-23) has the most clean pickups overall? Return just the hour.
    sql: >
      select pickup_hour from marts.fct_trips group by pickup_hour order by count(*) desc limit 1

  - id: m06
    difficulty: medium
    question: What percentage of clean trips picked up on or after 2025-01-05 have a CBD congestion fee greater than zero?
    sql: >
      select 100.0 * avg(case when cbd_congestion_fee > 0 then 1 else 0 end)
      from marts.fct_trips where pickup_date >= date '2025-01-05'

  - id: m07
    difficulty: medium
    question: What is the average card tip percentage for clean yellow taxi trips picked up in 2025?
    sql: >
      select avg(tip_pct) from marts.fct_trips
      where service_type = 'yellow' and pickup_date between date '2025-01-01' and date '2025-12-31'

  - id: m08
    difficulty: medium
    question: How many clean green taxi trips were picked up in each month of 2025? Return the month number and trip count.
    sql: >
      select month(pickup_date) as month, count(*) as trips from marts.fct_trips
      where service_type = 'green' and year(pickup_date) = 2025 group by 1

  - id: m09
    difficulty: medium
    question: What is the median metered fare of clean trips picked up in CBD zones in 2025?
    sql: >
      select median(fare_amount) from marts.fct_trips
      where pickup_in_cbd and year(pickup_date) = 2025

  - id: m10
    difficulty: medium
    question: How many clean trips started in a CBD zone and ended outside the CBD in December 2025?
    sql: >
      select count(*) from marts.fct_trips
      where pickup_in_cbd and not dropoff_in_cbd
        and pickup_date between date '2025-12-01' and date '2025-12-31'

  - id: m11
    difficulty: medium
    question: Which day of the week had the most clean pickups in 2024? Return the day name.
    sql: >
      select d.day_name from marts.fct_trips f join marts.dim_date d on d.date_day = f.pickup_date
      where d.year = 2024 group by d.day_name order by count(*) desc limit 1

  - id: m12
    difficulty: medium
    question: What is the average duration in minutes of clean trips longer than 20 miles?
    sql: select avg(trip_minutes) from marts.fct_trips where trip_distance_mi > 20

  - id: m13
    difficulty: medium
    question: How many clean trips were picked up on US federal holidays in 2025?
    sql: >
      select count(*) from marts.fct_trips f join marts.dim_date d on d.date_day = f.pickup_date
      where d.is_holiday and d.year = 2025

  - id: m14
    difficulty: medium
    question: How many taxi zones are there in each TLC service zone? Return service zone and zone count.
    sql: select service_zone, count(*) from marts.dim_zone group by service_zone

  - id: m15
    difficulty: medium
    question: Which pickup zone had the highest total CBD congestion fees charged on clean trips in 2025? Return the zone name.
    sql: >
      select z.zone from marts.fct_trips f join marts.dim_zone z on z.location_id = f.pu_location_id
      where year(f.pickup_date) = 2025 group by z.zone order by sum(f.cbd_congestion_fee) desc limit 1

  - id: m16
    difficulty: medium
    question: For clean trips picked up in CBD zones, what was the overall average speed in mph (total miles divided by total hours) in 2024 and in 2025? Return year and speed.
    sql: >
      select year(pickup_date) as year, sum(trip_distance_mi) / (sum(trip_minutes) / 60) as mph
      from marts.fct_trips where pickup_in_cbd and year(pickup_date) in (2024, 2025) group by 1

  - id: m17
    difficulty: medium
    question: How many clean trips had more than 4 passengers?
    sql: select count(*) from marts.fct_trips where passenger_count > 4

  - id: m18
    difficulty: medium
    question: Using the daily zone aggregate for both services combined, how many trips were picked up in border zones in 2025?
    sql: >
      select sum(a.trip_count) from marts.agg_zone_day a join marts.dim_zone z using (location_id)
      where z.is_border_zone and a.service_type = 'all' and year(a.date_day) = 2025

  # ---------------------------------------------------------------- hard
  - id: h01
    difficulty: hard
    question: >
      Between 2024-01-01 and 2025-12-31, what was the average number of clean pickups per calendar day
      in CBD zones and in non-CBD zones, before and after 2025-01-05? Return zone group ('CBD' or 'non-CBD'),
      period ('before' or 'after') and average trips per day.
    sql: >
      with t as (
        select case when f.pickup_in_cbd then 'CBD' else 'non-CBD' end as zone_group,
               case when f.pickup_date >= date '2025-01-05' then 'after' else 'before' end as period,
               count(*) as trips
        from marts.fct_trips f
        where f.pickup_date between date '2024-01-01' and date '2025-12-31'
        group by 1, 2
      ), d as (
        select case when date_day >= date '2025-01-05' then 'after' else 'before' end as period,
               count(*) as days
        from marts.dim_date where date_day between date '2024-01-01' and date '2025-12-31' group by 1
      )
      select t.zone_group, t.period, t.trips * 1.0 / d.days from t join d using (period)

  - id: h02
    difficulty: hard
    question: By what percentage did the number of clean pickups in CBD zones change from 2024 to 2025?
    sql: >
      select 100.0 * (sum(case when year(pickup_date) = 2025 then 1 else 0 end)
                      / sum(case when year(pickup_date) = 2024 then 1 else 0 end) - 1)
      from marts.fct_trips where pickup_in_cbd

  - id: h03
    difficulty: hard
    question: For each month of 2025, what percentage of clean pickups were in CBD zones? Return month number and percentage.
    sql: >
      select month(pickup_date) as month, 100.0 * avg(case when pickup_in_cbd then 1 else 0 end) as pct
      from marts.fct_trips where year(pickup_date) = 2025 group by 1

  - id: h04
    difficulty: hard
    question: >
      Which 3 border zones had the largest percentage increase in clean pickups from 2024 to 2025?
      Return zone name and percentage change, largest first.
    ordered: true
    sql: >
      with y as (
        select z.zone,
               sum(case when year(a.date_day) = 2024 then a.trip_count else 0 end) as t2024,
               sum(case when year(a.date_day) = 2025 then a.trip_count else 0 end) as t2025
        from marts.agg_zone_day a join marts.dim_zone z using (location_id)
        where z.is_border_zone and a.service_type = 'all' group by z.zone
      )
      select zone, 100.0 * (t2025 * 1.0 / t2024 - 1) as pct_change from y order by pct_change desc limit 3

  - id: h05
    difficulty: hard
    question: >
      Which 5 non-CBD zones had the largest absolute increase in clean pickups from 2024 to 2025?
      Return zone name and the increase in trips, largest first.
    ordered: true
    sql: >
      with y as (
        select z.zone,
               sum(case when year(a.date_day) = 2025 then a.trip_count else 0 end)
             - sum(case when year(a.date_day) = 2024 then a.trip_count else 0 end) as increase
        from marts.agg_zone_day a join marts.dim_zone z using (location_id)
        where not z.is_cbd and a.service_type = 'all' group by z.zone
      )
      select zone, increase from y order by increase desc limit 5

  - id: h06
    difficulty: hard
    question: >
      For weekday clean pickups in CBD zones, which hour of the day had the smallest change in total
      pickups from 2024 to 2025 (2025 count minus 2024 count)? Return just the hour.
    sql: >
      select f.pickup_hour
      from marts.fct_trips f join marts.dim_date d on d.date_day = f.pickup_date
      where f.pickup_in_cbd and not d.is_weekend and d.year in (2024, 2025)
      group by f.pickup_hour
      order by sum(case when d.year = 2025 then 1 else 0 end) - sum(case when d.year = 2024 then 1 else 0 end)
      limit 1

  - id: h07
    difficulty: hard
    question: >
      What was the median metered fare of clean trips that both started and ended in CBD zones,
      in 2024 and in 2025? Return year and median fare.
    sql: >
      select year(pickup_date) as year, median(fare_amount) from marts.fct_trips
      where pickup_in_cbd and dropoff_in_cbd and year(pickup_date) in (2024, 2025) group by 1

  - id: h08
    difficulty: hard
    question: >
      How many clean pickups were there in CBD zones in each week from 4 weeks before to 4 weeks after
      the congestion pricing start? Use the weeks_from_policy week numbers from -4 to 4 and return week number and trips.
    sql: >
      select d.weeks_from_policy, count(*) as trips
      from marts.fct_trips f join marts.dim_date d on d.date_day = f.pickup_date
      where f.pickup_in_cbd and d.weeks_from_policy between -4 and 4 group by 1

  - id: h09
    difficulty: hard
    question: >
      For clean trips picked up in 2025, what is the average trip distance by pickup borough, only for
      boroughs with more than 10,000 such trips? Return borough and average distance, longest first.
    ordered: true
    sql: >
      select z.borough, avg(f.trip_distance_mi) as avg_mi
      from marts.fct_trips f join marts.dim_zone z on z.location_id = f.pu_location_id
      where year(f.pickup_date) = 2025 group by z.borough having count(*) > 10000 order by avg_mi desc

  - id: h10
    difficulty: hard
    question: On which date in 2025 were clean CBD pickups lowest, and how many were there? Return the date and trip count.
    sql: >
      select pickup_date, count(*) as trips from marts.fct_trips
      where pickup_in_cbd and year(pickup_date) = 2025 group by pickup_date order by trips limit 1

  - id: h11
    difficulty: hard
    question: >
      In 2025, what percentage of CBD zone-days (in the daily zone aggregate, both services combined)
      had more than 500 pickups?
    sql: >
      select 100.0 * avg(case when a.trip_count > 500 then 1 else 0 end)
      from marts.agg_zone_day a join marts.dim_zone z using (location_id)
      where z.is_cbd and a.service_type = 'all' and year(a.date_day) = 2025

  - id: h12
    difficulty: hard
    question: >
      Which CBD zone had the highest average daily pickups in 2025, averaging over the days on which it
      had at least one pickup (daily zone aggregate, both services combined)? Return zone name and the average.
    sql: >
      select z.zone, avg(a.trip_count) as avg_daily
      from marts.agg_zone_day a join marts.dim_zone z using (location_id)
      where z.is_cbd and a.service_type = 'all' and year(a.date_day) = 2025
      group by z.zone order by avg_daily desc limit 1
